; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Таблица разделов: LittleFS на разделе "storage" (см. partitions.csv)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I src/config
    -I lib/hal/include
    -I lib/drivers/include
    -I lib/fs/include
    -I lib/wifi/include
    -I lib/web/include
    -I lib/config_service/include
    -I lib/freertos_task/include
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; FreeRTOS: статическое выделение задач разрешено
    ; (tick rate оставляем дефолтным 100 Гц — переопределение через build_flags
    ;  ломает сборку, т.к. freertos_kernel компилируется раньше флага)
    -D configUSE_STATIC_ALLOCATION=1

; Явно перечисляем локальные библиотеки из lib/ (LDF не подхватывает их при src_dir=src)
lib_deps =
    hal
    web
    drivers
    fs
    wifi
    config_service
    freertos_task
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/ESPAsyncWebServer@^1.1.3
    me-no-dev/AsyncTCP@^1.1.1
    ; Драйвер LittleFS скачан и лежит в папке проекта deps/esp_littlefs
    ; (joltwallet/esp_littlefs v1.14.8 + littlefs-project/littlefs v2.5.1)
    ${PROJECT_DIR}/deps/esp_littlefs

; Локальные библиотеки проекта лежат в lib/ (автосканируется PlatformIO),
; драйвер LittleFS — в deps/esp_littlefs (подключается через lib_deps).

monitor_filters = esp32_exception_decoder

; FW 0.6.17: экспериментальные сборки для бисекции boot loop
[env:esp32dev_exp1]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DBOOT_MINIMAL_EXPERIMENT=1

[env:esp32dev_exp2]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DBOOT_MINIMAL_EXPERIMENT=2

; FW 0.6.18: web::start() БЕЗ прикладных задач (зеркальный exp2)
[env:esp32dev_exp3]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DBOOT_MINIMAL_EXPERIMENT=3
