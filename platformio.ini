; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Таблица разделов: LittleFS на разделе "storage" (см. partitions.csv)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; FreeRTOS: статическое выделение задач разрешено, tick 1000 Гц
    -D configUSE_STATIC_ALLOCATION=1
    -D configTICK_RATE_HZ=1000

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/ESPAsyncWebServer@^1.1.3
    me-no-dev/AsyncTCP@^1.1.1
    ; Встроенная компонента ESP-IDF: драйвер LittleFS для Arduino-фреймворка
    https://github.com/espressif/esp_littlefs.git#v1.18.1

monitor_filters = esp32_exception_decoder
